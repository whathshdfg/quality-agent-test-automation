services:
  - type: web
    name: quality-agent-studio
    runtime: docker
    plan: free
    rootDir: atoms-demo
    dockerfilePath: ./atoms-demo/Dockerfile
    dockerContext: ./atoms-demo
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.deepseek.com
      - key: OPENAI_MODEL
        value: deepseek-chat
      - key: DATABASE_URL
        fromDatabase:
          name: quality-agent-studio-db
          property: connectionString

databases:
  - name: quality-agent-studio-db
    plan: free
    databaseName: quality_agent_studio
    user: quality_agent_studio
